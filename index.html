<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Control de Acceso QR - COBACH 234</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f3f5f8;
      margin: 0;
      padding: 15px;
      text-align: center;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.15);
    }

    h1 {
      color: #0b2343;
      margin-bottom: 5px;
      font-size: 36px;
    }

    h2 {
      color: #b51f2e;
      margin-top: 0;
      font-size: 20px;
    }

    .subtitulo {
      color: #555;
      margin-bottom: 20px;
      font-size: 18px;
    }

    #btnCamara {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 12px;
      background: #0b2343;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 15px;
    }

    #reader {
      width: 100%;
      margin-top: 10px;
    }

    #resultado {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      background: #d1e7dd;
      color: #0f5132;
    }

    .tituloResultado {
      font-size: 22px;
      font-weight: bold;
    }

    .matricula {
      margin-top: 10px;
      font-size: 25px;
      font-weight: bold;
      color: #0b2343;
      word-break: break-word;
    }
.botonesMovimiento {
  display: flex;
  gap: 12px;
  margin-bottom: 15px;
}

.btnMovimiento {
  flex: 1;
  padding: 18px 8px;
  border: none;
  border-radius: 12px;
  color: white;
  font-size: 20px;
  font-weight: bold;
}

.entrada {
  background: #198754;
}

.salida {
  background: #dc3545;
}

.seleccionado {
  outline: 5px solid #ffc107;
}

#movimientoActual {
  margin-bottom: 18px;
  font-size: 17px;
  color: #555;
}
  </style>
</head>


<body>

<div class="contenedor">

  <h1>COBACH</h1>

  <h2>
    Plantel 234 · Tuxtla Plan de Ayala
  </h2>

  <div class="subtitulo">
    Control de Acceso QR
  </div>

  <button id="btnCamara"
          onclick="iniciarCamara()">
    <div class="botonesMovimiento">

  <button id="btnEntrada"
          class="btnMovimiento entrada"
          onclick="seleccionarMovimiento('ENTRADA')">
    ENTRADA
  </button>

  <button id="btnSalida"
          class="btnMovimiento salida"
          onclick="seleccionarMovimiento('SALIDA')">
    SALIDA
  </button>

</div>

<div id="movimientoActual">
  Seleccione ENTRADA o SALIDA
</div>
    📷 ACTIVAR LECTOR QR
  </button>

  <div id="reader"></div>

  <div id="resultado">

    <div class="tituloResultado">
      ✓ CÓDIGO QR LEÍDO
    </div>

    <div id="matriculaLeida"
         class="matricula">
    </div>

  </div>

</div>


<script>

  let lector = null;
  let codigoProcesado = false;
  let movimientoSeleccionado = '';
const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbyQHiSP-r_D_XFUjzUAEMwf4JDITjgvGlfJaajZXz59it62HJdUl4GNxjc2TjxfH0clJw/exec';

  function seleccionarMovimiento(tipo) {

  movimientoSeleccionado = tipo;

  document.getElementById('btnEntrada')
    .classList.remove('seleccionado');

  document.getElementById('btnSalida')
    .classList.remove('seleccionado');

  if (tipo === 'ENTRADA') {
    document.getElementById('btnEntrada')
      .classList.add('seleccionado');
  } else {
    document.getElementById('btnSalida')
      .classList.add('seleccionado');
  }

  document.getElementById('movimientoActual')
    .innerHTML =
      'Movimiento seleccionado: <strong>' +
      tipo +
      '</strong>';
}
  
  function iniciarCamara() {

if (!movimientoSeleccionado) {
  alert('Primero seleccione ENTRADA o SALIDA.');
  return;
}
    
    codigoProcesado = false;

    document.getElementById('resultado').style.display = 'none';

    if (!lector) {
      lector = new Html5Qrcode("reader");
    }

    lector.start(
      {
        facingMode: "environment"
      },
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },

     async function(codigo) {

  if (codigoProcesado) {
    return;
  }

  codigoProcesado = true;

  const matricula =
    String(codigo)
      .trim()
      .toUpperCase();

  // Por ahora probaremos únicamente ENTRADA.
  const movimiento = movimientoSeleccionado;

  document.getElementById('matriculaLeida')
    .textContent =
      'Procesando: ' + matricula;

  document.getElementById('resultado')
    .style.display = 'block';

  try {

    const url =
      URL_APPS_SCRIPT +
      '?matricula=' +
      encodeURIComponent(matricula) +
      '&movimiento=' +
      encodeURIComponent(movimiento);

    const respuesta = await fetch(url);

    const datos = await respuesta.json();

    if (datos.ok) {

      document.getElementById('matriculaLeida')
        .innerHTML =
          datos.nombre +
          '<br><br>' +
          'Grupo: ' + datos.grupo +
          '<br>' +
          datos.fecha + ' · ' + datos.hora +
          '<br><br>' +
          '✓ ENTRADA REGISTRADA';

    } else {

      document.getElementById('matriculaLeida')
        .innerHTML =
          '⚠ ' + datos.mensaje;

    }

  } catch (error) {

    document.getElementById('matriculaLeida')
      .innerHTML =
        '⚠ Error de comunicación con el sistema.';

    console.error(error);
  }

  lector.stop()
    .catch(function() {});

},

      function() {
        // Continúa buscando un QR.
      }
    )

    .catch(function(error) {

      alert(
        "No fue posible abrir la cámara.\n\n" +
        error
      );

    });

  }

</script>

</body>
</html>
